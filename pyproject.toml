[project]
name = "android-device-agent"
version = "0.3.0"
description = "Remote Android device agent and low-latency desktop controller over ADB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "av>=15.0.0",
  "fastapi>=0.116.0",
  "uvicorn>=0.35.0",
  "pydantic>=2.11.0",
  "requests>=2.32.0",
  "PySide6>=6.8.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pyinstaller>=6.15.0",
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[project.scripts]
android-device-agent = "android_device_agent.agent_main:main"
android-remote-client = "android_device_agent.client_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/android_device_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
